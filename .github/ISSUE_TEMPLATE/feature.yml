name: Feature request
description: Suggest an idea
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem matters more than the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: "What would you like to see?" }
  - type: textarea
    id: tried
    attributes: { label: "What have you tried?" }
