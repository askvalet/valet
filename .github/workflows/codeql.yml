name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '21 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    # GitHub only offers code scanning on public repositories, so this starts by itself once the repo is
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
