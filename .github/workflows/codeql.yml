name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '21 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    # GitHub only offers code scanning on public repositories, so this starts by itself once the repo is
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
