# Sign-in. Off by default, and then Valet is read-only (no buttons, no assistant tools that change things).
# local: built-in accounts · proxy: trust your sign-in proxy's user header · oidc: OpenID Connect · trustNetwork: true if only your VPN/tailnet reaches it
auth: { mode: none, trustNetwork: false }

# Valet configuration. `${NAME}` is replaced from the environment, so keep secrets in .env or Docker secrets.
title: Home
greeting: Sam                      # "Sam's homelab"
location: Toronto, Canada          # gives the assistant local context

# The look. Everything's optional; docs/configuration.md has the rest (fonts, shape, glass, hero, chat, nav, format…).
# appearance:
#   wallpaper: ./data/wallpaper.jpg  # a file, an image URL, a colour, a gradient, or a list with rotate: 30m
#   theme: auto                      # or system (follows the device over a wallpaper too), light, dark
#   colors: { accent: "#0a84ff" }
#   font: { family: Inter, url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600" }
#   shape: { radius: 14 }            # 0 is sharp corners
#   glass: { opacity: 0.5, blur: 36 }   # material: liquid for clearer glass with a lit edge (each browser can try it in ⌘K)
#   density: comfortable             # or compact, spacious
#   rim: 0.6                         # a fixed bevel of light on the edge of dark glass, 0 to 1
#   sounds: { enabled: false, volume: 0.4 }   # quiet sounds for taps, done, not now, notices; each browser can flip them in ⌘K
# notice: Family server            # a quiet pill above the greeting
# sandbox: true                    # for trying Valet on made-up services: nothing is saved, each visitor gets a private copy in memory
# hero: { align: center, review: true, scope: true }   # review: true, false or end (a card closing the overview as well as the link). scope: the ask box names real examples, from your integrations or a list
# chat: { open: center, suggestions: ai, beam: once, beamColor: mono, beamStrength: 0.45, followUps: ["Is anything down?"] }
#   open: center, right, left, bottom, page
#   beam: a light around the ask box: off, always, focus (while typing), thinking, once (a lap on load, then while typing)
#   followUps: offered under each answer, in place of what the tool suggests
# format: { clock: 24h, temperature: c }

# The assistant. Any OpenAI-compatible server (Ollama, llama.cpp, vLLM, LM Studio, OpenRouter, OpenAI) or Anthropic.
assistant:
  name: Valet
  provider: openai-compatible
  baseURL: http://localhost:11434/v1   # Ollama
  model: qwen3:8b
  # what it may use, per integration: none | read | write (adds things, like saving a link) | control (changes or removes them). Both ask you first
  access: { default: read, downloads: control, docs: write, bookmarks: write }

integrations:
  docs:
    type: paperless                # ask about your documents; paste or attach to file them
    url: http://paperless:8000
    token: ${PAPERLESS_TOKEN}
  coming:
    type: arr                      # Sonarr/Radarr: episodes and movies coming up, as posters with the day
    sonarr: { url: "http://sonarr:8989", apiKey: "${SONARR_KEY}" }
    radarr: { url: "http://radarr:7878", apiKey: "${RADARR_KEY}" }
    # plex: https://plex.example.com   # Plex's web address: what's ready then opens there
  dns:
    type: pihole                   # Pi-hole v6: blocked share, a day of queries, pause/resume
    url: http://pihole
    password: ${PIHOLE_PASSWORD}   # an app password (Settings → Web interface/API) is best
  uptime:
    type: uptimekuma               # Uptime Kuma: up/down and uptime over 30 days, certificates expiring
    url: http://uptime-kuma:3001
    username: ${KUMA_USER}         # or username: "" and password: an API key
    password: ${KUMA_PASSWORD}
  drives:
    type: scrutiny                 # Scrutiny: drive health (SMART), temperature, age
    url: http://scrutiny:8080
  games:
    type: romm                     # RomM: recently added games with box art
    url: http://romm:8080
    username: ${ROMM_USER}
    password: ${ROMM_PASSWORD}
  indexers:
    type: indexers                 # Prowlarr indexer health and Bazarr missing subtitles
    prowlarr: { url: "http://prowlarr:9696", apiKey: "${PROWLARR_KEY}" }
    bazarr: { url: "http://bazarr:6767", apiKey: "${BAZARR_KEY}" }
  ollama:
    type: ollama                   # installed and loaded models
    url: http://ollama:11434
  photos:
    type: immich                   # search photos by what's in them, by person or date; "on this day" on the page
    url: http://immich:2283
    apiKey: ${IMMICH_KEY}          # Immich → Account settings → API keys (read permissions are enough)
  requests:
    type: seerr                    # ask for a movie or show in chat and it's requested (asks you to confirm first)
    url: http://seerr:5055
    apiKey: ${SEERR_KEY}
    # downloads: https://qbittorrent.example.com   # where "See progress" goes; without it, Seerr's own page for the title
  bookmarks:
    type: karakeep                 # send a link to save it; ask about what you've saved
    url: http://karakeep:3000
    apiKey: ${KARAKEEP_KEY}
  # nvr:
  #   type: frigate                # its stats as `nvr.status`, and `nvr.cameras`: a live view with what it has noticed. Port 5000 needs no sign-in
  #   url: http://frigate:5000
  #   cameras: [front, drive]      # which ones, in this order; all of them by default
  #   go2rtc: http://frigate:1984  # smooth video instead of snapshots, if your cameras send H.264
  # yard:
  #   type: camera                 # any camera that hands over a JPEG: Scrypted, ZoneMinder, Shinobi, an RTSP-to-JPEG bridge
  #   cameras:
  #     - { name: Shed, url: http://192.168.1.20/snapshot.jpg }
  pc:
    type: rgb-control              # a live 3D model of the PC from your own endpoint: askvalet.dev/integrations/rgb-control/
    url: http://host:8098
    presets: true                  # show the lighting presets when no part is selected
    controls: true                 # false: look, don't touch
    view: { turn: -27, tilt: -18, draggable: true }   # a view you drag to is remembered in your browser
    build:                         # what's in the case, so the model looks like yours (all optional)
      radiatorFans: 3              # 0–3 on a top radiator
      floorFans: 3                 # 0–3 intake fans on the floor
      cooler: aio                  # aio | air
      ram: 4                       # sticks
      ramLabel: ""                 # text on the sticks
      board: { label: "", plate: "", accent: "#8a8f98" }   # heatsink name, M.2 plate text, line-art colour
      gpu: { label: "", badge: "" }   # engraved name, lit badge; gpu: null for none
  weather:
    type: weather                  # Open-Meteo, no key needed
    latitude: 43.65
    longitude: -79.38
  system:
    type: glances
    url: http://glances:61208
  services:
    type: http
    targets:
      - { name: Plex, url: "http://plex:32400/identity", href: "https://plex.example.com" }
      - { name: Home Assistant, url: "http://homeassistant:8123" }
  downloads:
    type: qbittorrent
    url: http://qbittorrent:8080
    username: ${QBIT_USER}
    password: ${QBIT_PASS}
  plex:
    type: tautulli
    url: http://tautulli:8181
    apiKey: ${TAUTULLI_KEY}
  home:
    type: homeassistant
    url: http://homeassistant:8123
    token: ${HA_TOKEN}
    cards:
      lights:
        title: Lights
        icon: bulb
        entities: [light.living_room, light.office, { id: scene.movie_night, name: Movie night }]
    # a dial for one climate entity, placed as home.hallway; modes picks and orders its buttons (default: all of them)
    thermostats:
      hallway: { entity: climate.hallway, title: Hallway, modes: [off, home, sleep, away] }

# Any MCP server's tools, under the same access rules.
mcp:
  homeassistant:
    url: http://homeassistant:8123/api/mcp
    headers: { Authorization: "Bearer ${HA_TOKEN}" }
    access: read

# Reminders and notices when you're not looking. Valet's own notifications need nothing here: turn them on per device in
# ⌘K ("Notifications on this device"; HTTPS and sign-in needed). Other services as channels, e.g. ntfy:
# notify:
#   channels: [{ type: ntfy, url: https://ntfy.sh/my-topic }]
#   webPush: { contact: "mailto:you@example.com" }   # how a push service can reach you

# Valet as a read-only MCP server for your own AI client (Claude Desktop, an editor): POST /mcp with this token.
# mcpServer:
#   token: ${VALET_MCP_TOKEN}        # openssl rand -hex 32, in .env
#   access: { default: read }        # or { default: none, plex: read }: only what you open

# Backup health: every job the integrations report, on the card valet.backups, worst first. Overdue means no success
# within the job's schedule, or this when the service doesn't say one. Problems and recoveries reach notify.channels.
# backups: { overdue: 26h, expect: { Offsite copy: 8d } }

# What the homepage shows, top to bottom. Widgets are "<integration>.<widget>".
# Small ring gauges in the top bar; hover one for its live graph. Any widget with headline numbers works.
menubar: [system.tiles]
# A ring beside the clock: where the temperature sits between today's low and high.
weather: weather.now
# What's happening right now, as rings in the top bar, in this order.
live:
  activities: [plex.streams, downloads.active]
  notify:                          # a short toast at the bottom of the page when things change (none unless listed)
    - { widget: downloads.active, on: end, text: "{title} finished downloading" }
    - { widget: services.status, on: down }   # also: up, start

nav: { side: left }               # where the tab buttons sit: left, right, top or bottom
# Each layout section is a tab in the rail. Per section:
#   display: cards | tiles | rings | media    how its widgets are drawn
#   columns: n          cards per row (in a sidebar: the list's columns)
#   place: left|right   a sidebar beside the rest of the page
#   variant: minimal    tighter rows, just the essentials (services: icon, name, dot)
#   header: false       its cards drop their title bar
#   overview: false     only on its own tab, not the overview
#   tab: Name           share a tab with other sections (default: its title)
#   chat: true          its tab also holds the assistant, full page
#   heading: false      no title above it on the page (it still names its tab)
# A widget is "instance.widget", or { widget: instance.widget, size: small | wide | medium | tall | large }:
#   small = its headline as a tile, wide = that tile at twice the width, medium = the card,
#   tall = the card over two rows (a photo card as the centrepiece), large = wider, with room for more
# It can also say how it's drawn, whatever the data, as in { widget: plex.top, view: focus }. What doesn't fit stays as it was:
#   numbers: line, bars, stream, race, heatmap (needs dates), ranked, pie
#   pictures: row, spotlight, focus, desk, windows, tickets, mosaic, flashback, album
# rows: n is how many rows it spans, so smaller cards can stack beside it, as in { widget: plex.top, size: tall, rows: 3 }
layout:
  - title: Now
    widgets: [system.overview, downloads.active]
  - title: Watching
    widgets: [plex.streams, plex.recent]
  - title: Home
    widgets: [home.lights]
  - title: Services
    widgets: [services.status, system.disks]

# /wall: a full-screen page for a wall tablet or a spare monitor, with its own cards. Left out, it shows the time and
# weather, your services and what's playing or downloading. It never acts, whoever is signed in.
# wall:
#   every: 1m                        # how long each page stays
#   night: { from: sunset, to: sunrise, dim: 0.9 }   # or times like 22:00; false never dims
#   token: ${VALET_WALL_TOKEN}       # for a screen that can't sign in: open /wall#key=<token> once (openssl rand -hex 32)
#   pages:
#     - title: Now
#       layout:
#         - widgets: [plex.streams, downloads.active]
#           columns: 2
#     - title: Services
#       every: 30s
#       layout:
#         - widgets: [services.status]
