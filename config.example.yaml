# Atrium configuration. `${NAME}` is replaced from the environment, so keep secrets in .env or Docker secrets.
title: Home
greeting: Sam                      # "Good evening, Sam"
location: Toronto, Canada          # gives the assistant local context

# The assistant. Any OpenAI-compatible server (Ollama, llama.cpp, vLLM, LM Studio, OpenRouter, OpenAI) or Anthropic.
assistant:
  name: Atrium
  provider: openai-compatible
  baseURL: http://localhost:11434/v1   # Ollama
  model: qwen3:8b
  # what it may use: none | read | control. Control actions always ask you first.
  access: { default: read, downloads: control }

integrations:
  pc:
    type: rgb-control              # github.com/<you>/rgb-control: a live 3D model of the PC with its lighting
    url: http://host:8098
    presets: true                  # show the lighting presets when no part is selected
    controls: true                 # false: look, don't touch
    view: { turn: -15, tilt: 7, draggable: true }
  weather:
    type: weather                  # Open-Meteo, no key needed
    latitude: 43.65
    longitude: -79.38
  system:
    type: glances
    url: http://glances:61208
  services:
    type: http
    targets:
      - { name: Plex, url: "http://plex:32400/identity", href: "https://plex.example.com" }
      - { name: Home Assistant, url: "http://homeassistant:8123" }
  downloads:
    type: qbittorrent
    url: http://qbittorrent:8080
    username: ${QBIT_USER}
    password: ${QBIT_PASS}
  plex:
    type: tautulli
    url: http://tautulli:8181
    apiKey: ${TAUTULLI_KEY}
  home:
    type: homeassistant
    url: http://homeassistant:8123
    token: ${HA_TOKEN}
    cards:
      lights:
        title: Lights
        icon: bulb
        entities: [light.living_room, light.office, { id: scene.movie_night, name: Movie night }]

# Any MCP server's tools, under the same access rules.
mcp:
  homeassistant:
    url: http://homeassistant:8123/api/mcp
    headers: { Authorization: "Bearer ${HA_TOKEN}" }
    access: read

# What the homepage shows, top to bottom. Widgets are "<integration>.<widget>".
# Small ring gauges in the top bar; hover one for its live graph. Any widget with headline numbers works.
menubar: [system.tiles]
# A ring beside the clock: where the temperature sits between today's low and high.
weather: weather.now

layout:
  - title: Now
    widgets: [system.overview, downloads.active]
  - title: Watching
    widgets: [plex.streams, plex.recent]
  - title: Home
    widgets: [home.lights]
  - title: Services
    widgets: [services.status, system.disks]
