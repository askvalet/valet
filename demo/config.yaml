# The public demo: real Valet, made-up homelab. Everything on the page comes from integrations/homelab.mjs and the
# assistant is the scripted stand-in in mock-model.mjs. No secrets, no real services, nothing worth stealing.
title: Valet
greeting: Daniel
timezone: America/Toronto
location: Example, Canada
allowedHosts: []
auth: { mode: none, trustNetwork: true }   # every control is make-believe and undoes itself within ten minutes
reload: false
sandbox: true   # nothing is saved, and each visitor gets a private copy that's gone when they leave

appearance:
  theme: dark   # the demo stays dark; `system` would follow the visitor's device
  maxWidth: 2400px   # as wide as the chat page: big screens get more on show
  glass: { material: liquid }   # the clearer glass; ⌘K can switch a browser back to frosted
  wallpaper: /demo/wallpaper.jpg
  dim: 0.3
  blur: 4
  rim: 0.7

assistant:
  baseURL: http://valet-demo-model:8080/v1
  apiKey: demo
  model: qwen3.8-27b
  contextWindow: 32768   # what the scripted model claims to hold, so the chat's context meter has something to fill
  name: Valet
  maxSteps: 4
  access: { default: control }
  background: { watch: false, brief: true, suggest: true }
  suggestions: [What should we watch tonight?, Turn off the living room lights, Anything happen overnight?, How are the downloads doing?]

integrations:
  lab:
    type: demo-homelab

chat:
  beam: once
  beamColor: colorful
  beamStrength: 1
  followUps: [Why is Mealie down?, Pause Pi-hole, Turn off the living room lights, What should we watch tonight?, Anything happen overnight?, How are the downloads doing?]
hero: { scope: [downloads, lights, what to watch], review: false, align: left }   # the greeting at the top left, beside the top bar, for room   # the year in review is still at #recap, just not offered

menubar: [lab.system]
weather: lab.weather
calendar: lab.calendar
format: { weekStart: monday }
live:
  activities: [lab.calendar, lab.streams, lab.downloads, lab.home]

nav: { order: [Services, AI, Home, Media, Library] }

# /wall: its own pages for a screen across the room, taking turns every minute
wall:
  every: 1m
  pages:
    - title: Now
      layout:
        - widgets: [lab.streams, lab.downloads]
          columns: 2
        - display: tiles
          widgets: [lab.system]
    - title: House
      every: 30s
      layout:
        - widgets:
            - { widget: lab.cameras, size: large, rows: 2 }
            - { widget: lab.thermostat, size: medium }
            - { widget: lab.sky, size: medium }
    - title: Services
      layout:
        - widgets: [lab.services]
          columns: 1
          header: false

layout:
  - title: Services
    variant: minimal
    header: false
    widgets: [lab.services]
  - tab: Services   # empty, so left out, until chat adds it ("Add an internet speed card"); undo takes it away
    heading: false
    widgets: [lab.speed]
  - tab: Services
    heading: false
    overview: false
    columns: { phone: 2, tablet: 8, desktop: 8 }   # eight tracks from tablet up
    widgets:
      # updates, Pi-hole, then CPU over memory; then backups, containers and the drives side by side
      - { widget: lab.updates, size: medium, rows: 2 }
      - { widget: lab.dns, size: large, rows: 2 }
      - { widget: lab.cpu, size: medium }
      - { widget: lab.memory, size: medium }
      - { widget: valet.backups, size: medium, cols: 3, rows: 2 }
      - { widget: lab.containers, size: medium, cols: 3 }
      - { widget: lab.drives, size: medium, cols: 2, rows: 2 }
      - { widget: lab.traffic, size: medium, cols: 3 }   # under the containers: the network's day
  - title: AI
    display: tiles
    overview: false
    chat: true
    widgets: [lab.ai]
  # Home: the cameras half the width over two rows; beside them the thermostat and the weather, then the doors and
  # who's home; then the house, the desktop and the pages being watched a third each; then the week's meals beside the energy
  - title: Home
    icon: home
    heading: false
    overview: false
    columns: { phone: 1, tablet: 2, desktop: 4, wide: 4 }
    widgets:
      - { widget: lab.cameras, cols: 2, rows: 2 }
      - lab.thermostat
      - lab.weather
      - lab.doors      # Home Assistant: the lock, the garage door, the washer
      - lab.presence   # Home Assistant: who's home
  - tab: Home
    heading: false
    overview: false
    columns: { phone: 1, tablet: 2, desktop: 3, wide: 3 }
    widgets:
      - { widget: lab.home, header: false }
      - { widget: lab.pc, header: false }
      - lab.watching   # changedetection.io: prices and stock
  - tab: Home
    heading: false
    overview: false
    columns: { phone: 1, tablet: 3, desktop: 3, wide: 3 }
    widgets:
      - { widget: lab.mealie, cols: 2 }   # this week's meals from Mealie
      - lab.energy   # the last day's electricity: used and solar
  - title: Now
    heading: false
    tab: Media
    overview: false
    columns: 2
    widgets: [lab.streams, lab.downloads]
  # the overview, under Services: the house, the desktop and the calendar a third each, then
  # Pi-hole beside the drives, then what's playing over the downloads beside On this day, then the reading and what's new
  - heading: false
    columns: { phone: 1, tablet: 2, desktop: 3, wide: 3 }
    widgets:
      - { widget: lab.home, title: Home Assistant }
      - { widget: lab.pc, title: "Daniel's Desktop" }
      - lab.calendar
  - heading: false
    columns: { phone: 1, tablet: 3, desktop: 3, wide: 3 }
    widgets:
      - { widget: lab.dns, cols: 2 }   # Pi-hole's day beside the drives
      - lab.drives
  - heading: false
    columns: { phone: 1, tablet: 3, desktop: 3, wide: 3 }   # what's playing over the downloads beside On this day
    widgets:
      - { widget: lab.streams, cols: 1 }
      - { widget: lab.photos, cols: 2, rows: 2 }   # On this day beside what's playing over the downloads
      - { widget: lab.downloads, cols: 1 }
  - heading: false
    columns: { phone: 1, tablet: 2, desktop: 2, wide: 2 }
    widgets: [{ widget: lab.reading, view: focus }, { widget: lab.recent, view: focus }]
  - title: Media
    overview: false
    heading: false
    columns: { phone: 1, tablet: 3, desktop: 3, wide: 3 }
    widgets:
      # the race two thirds beside the year of viewing; then the games and the albums half each
      - { widget: lab.race, cols: 2 }
      - lab.viewing
  - tab: Media
    overview: false
    heading: false
    columns: 2
    widgets: [{ widget: lab.games, view: coverflow }, { widget: lab.top, view: coverflow }]   # games beside Navidrome's most played albums
  - title: Library
    icon: file   # a sheet of paper in the nav
    overview: false
    heading: false
    columns: { phone: 1, tablet: 3, desktop: 3, wide: 3 }
    widgets:
      - { widget: lab.news, rows: 2 }
      - { widget: lab.feeds, rows: 2 }
      - lab.docs
      - { widget: lab.reading, view: cards }
  - tab: Library
    overview: false
    heading: false
    columns: { phone: 1, tablet: 3, desktop: 3, wide: 3 }
    widgets:
      - lab.books
      - { widget: lab.album, view: masonry, cols: 2, rows: 2 }   # the trip as a collage, two thirds on the right
      - lab.listening   # Audiobookshelf: minutes a day, under the books
