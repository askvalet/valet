# The public demo: real Valet, made-up homelab. Everything on the page comes from integrations/homelab.mjs and the
# assistant is the scripted stand-in in mock-model.mjs. No secrets, no real services, nothing worth stealing.
title: Valet
greeting: Daniel
timezone: America/Toronto
location: Example, Canada
allowedHosts: []
auth: { mode: none, trustNetwork: true }   # every control is make-believe and undoes itself within ten minutes
reload: false
sandbox: true   # nothing is saved, and each visitor gets a private copy that's gone when they leave

appearance:
  theme: dark   # the demo stays dark; `system` would follow the visitor's device
  wallpaper: /demo/wallpaper.jpg
  dim: 0.3
  blur: 4
  rim: 0.7

assistant:
  baseURL: http://valet-demo-model:8080/v1
  apiKey: demo
  model: qwen3.8-27b
  contextWindow: 32768   # what the scripted model claims to hold, so the chat's context meter has something to fill
  name: Valet
  maxSteps: 4
  access: { default: control }
  background: { watch: false, brief: true, suggest: true }
  suggestions: [What should we watch tonight?, Turn off the living room lights, Anything happen overnight?, How are the downloads doing?]

integrations:
  lab:
    type: demo-homelab

chat:
  beam: once
  beamColor: colorful
  beamStrength: 1
  followUps: [Why is Mealie down?, Pause Pi-hole, Turn off the living room lights, What should we watch tonight?, Anything happen overnight?, How are the downloads doing?]
hero: { scope: [downloads, lights, what to watch], review: false, align: left }   # the greeting at the top left, beside the top bar, for room   # the year in review is still at #recap, just not offered

menubar: [lab.system]
weather: lab.weather
calendar: lab.calendar
format: { weekStart: monday }
live:
  activities: [lab.calendar, lab.streams, lab.downloads, lab.home]

nav: { order: [Services, AI, Home, Media, Library] }

# /wall: its own pages for a screen across the room, taking turns every minute
wall:
  every: 1m
  pages:
    - title: Now
      layout:
        - widgets: [lab.streams, lab.downloads]
          columns: 2
        - display: tiles
          widgets: [lab.system]
    - title: House
      every: 30s
      layout:
        - widgets:
            - { widget: lab.cameras, size: large, rows: 2 }
            - { widget: lab.thermostat, size: medium }
            - { widget: lab.sky, size: medium }
    - title: Services
      layout:
        - widgets: [lab.services]
          columns: 1
          header: false

layout:
  - title: Services
    variant: minimal
    header: false
    widgets: [lab.services]
  - tab: Services   # empty, so left out, until chat adds it ("Add an internet speed card"); undo takes it away
    heading: false
    widgets: [lab.speed]
  - tab: Services
    heading: false
    overview: false
    columns: { phone: 2, tablet: 8, desktop: 8 }   # eight tracks from tablet up
    widgets:
      # updates, Pi-hole, then CPU over memory; then backups, containers and the drives side by side
      - { widget: lab.updates, size: medium, rows: 2 }
      - { widget: lab.dns, size: large, rows: 2 }
      - { widget: lab.cpu, size: medium }
      - { widget: lab.memory, size: medium }
      - { widget: valet.backups, size: medium, cols: 3 }
      - { widget: lab.containers, size: medium, cols: 3 }
      - { widget: lab.drives, size: medium, cols: 2 }
  - title: AI
    display: tiles
    overview: false
    chat: true
    widgets: [lab.ai]
  - title: Home
    icon: home
    heading: false
    overview: false
    widgets:
      - { widget: lab.cameras, size: large, rows: 2 }
      - { widget: lab.thermostat, size: medium }
      - { widget: lab.weather, size: medium }
  - tab: Home
    heading: false
    overview: false
    columns: 2
    header: false
    widgets: [lab.home, lab.pc]
  - tab: Home
    heading: false
    overview: false
    columns: 1
    widgets: [lab.mealie]   # this week's meals from Mealie, the full width under the house
  - title: Now
    heading: false
    tab: Media
    overview: false
    columns: 2
    widgets: [lab.streams, lab.downloads]
  - tab: Home
    heading: false
    header: false
    overview: false
    columns: 1
    widgets: [lab.calendar]   # the month and the day beside it, the full width
  # the overview, under Services: the house, the desktop and the calendar a third each, then
  # what's playing, On this day and downloads a third each, then the reading, what's new and the tiles
  - heading: false
    columns: { phone: 1, tablet: 2, desktop: 3, wide: 3 }
    widgets:
      - { widget: lab.home, title: Home Assistant }
      - { widget: lab.pc, title: "Daniel's Desktop" }
      - lab.calendar
  - heading: false
    columns: { phone: 1, tablet: 1, desktop: 3, wide: 3 }
    widgets: [lab.streams, lab.photos, lab.downloads]
  - heading: false
    columns: { phone: 2, tablet: 4, desktop: 6, wide: 6 }
    widgets:
      - { widget: lab.reading, size: tall, view: row }   # the reading pile as a plain row of pages that snap
      - { widget: lab.recent, size: tall, view: focus }
      - { widget: lab.dns, size: small }
      - { widget: lab.uptime, size: small }
      - { widget: lab.upcoming, size: wide }
  - title: Media
    overview: false
    heading: false
    columns: 2   # the race and the albums half each
    widgets:
      - lab.race
      - { widget: lab.top, view: coverflow }   # Navidrome's most played albums, as covers to flip through
  - tab: Media
    overview: false
    heading: false
    columns: 1
    widgets: [lab.viewing]   # the year of viewing, the full width
  - tab: Media
    overview: false
    heading: false
    columns: 2
    widgets: [{ widget: lab.games, view: coverflow }, lab.recent]   # side by side, half the width each
  - title: Library
    icon: file   # a sheet of paper in the nav
    columns: 2
    overview: false
    widgets: [lab.album, lab.books]   # side by side, half the width each
  - title: Reading
    tab: Library
    overview: false
    columns: 2
    widgets: [lab.docs, { widget: lab.reading, view: cards }]   # two stacks of cards to deal through, half the width each
  - tab: Library
    heading: false
    overview: false
    columns: 2
    widgets: [lab.news, lab.feeds]
