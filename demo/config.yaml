# The public demo: real Valet, made-up homelab. Everything on the page comes from integrations/homelab.mjs and the
# assistant is the scripted stand-in in mock-model.mjs. No secrets, no real services, nothing worth stealing.
title: Valet
greeting: Daniel
timezone: America/Toronto
location: Example, Canada
allowedHosts: [demo.chotte.dev]   # add the public name here when the demo goes live
auth: { mode: none, trustNetwork: true }   # every control is make-believe and undoes itself within ten minutes
reload: false
footer: "A made-up home: every number and name is invented. Posters and backdrops come from [TMDB](https://www.themoviedb.org/); this demo is not endorsed or certified by TMDB. Camera footage from Wikimedia Commons by [Lan G.](https://commons.wikimedia.org/wiki/File:Tirana_traffic_lights.webm) (CC BY 4.0), [barbara.grilc; Barbara Rezar Grilc (video), Bo\u0161tjan Troha (sound), Du\u0161an Oblak (photo); via [Sounds of Changes](http://www.soundsofchanges.eu/sound/road-traffic-asphalt-and-cobblestone-road)](https://commons.wikimedia.org/wiki/File:Road_traffic_%E2%80%93_cobblestone_road.webm) (CC BY 3.0), [Domdomegg](https://commons.wikimedia.org/wiki/File:Urban_fox_at_night.webm) (CC BY 4.0), [Uusijani](https://commons.wikimedia.org/wiki/File:Raccoon_(Procyon_lotor) (CC0), [Matt MacGillivray from Toronto, Canada](https://commons.wikimedia.org/wiki/File:Blue_Jay_at_bird_feeder,_video_(3675639120) (CC BY 2.0). Photos: [Lake Louise](https://commons.wikimedia.org/wiki/File:1_lake_louise_pano_2019.jpg) (CC BY-SA 4.0), [Isle of Skye](https://commons.wikimedia.org/wiki/File:Quiraing,_Isle_of_Skye,_Scotland_-_Diliff.jpg) (CC BY-SA 3.0), [Torres del Paine Patagonia](https://commons.wikimedia.org/wiki/File:Cuernos_del_Paine_in_Torres_del_Paine_National_Park.jpg) (CC BY-SA 2.0), [Moraine Lake Banff](https://commons.wikimedia.org/wiki/File:Moraine_Lake_17092005.jpg) (Public domain). Saved pages are screenshots of the articles they link to."

appearance:
  wallpaper: /demo/wallpaper.jpg
  dim: 0.3
  blur: 4

assistant:
  baseURL: http://valet-demo-model:8080/v1
  apiKey: demo
  model: scripted demo
  name: Valet
  maxSteps: 4
  access: { default: control }
  background: { watch: false, brief: true, suggest: true }

integrations:
  lab:
    type: demo-homelab

chat: { beam: always }

menubar: [lab.system]
weather: lab.weather
calendar: lab.calendar
format: { weekStart: monday }
island:
  activities: [lab.streams, lab.downloads]
  idle: hide

layout:
  - title: Services
    variant: minimal
    header: false
    widgets: [lab.services]
  - tab: Services
    heading: false
    overview: false
    widgets:
      - { widget: lab.dns, size: large }
      - { widget: lab.drives, size: medium }
      - { widget: lab.containers, size: large }
      - { widget: lab.updates, size: medium }
      - { widget: lab.jobs, size: medium }
      - { widget: lab.releases, size: medium }
  - title: AI
    display: tiles
    overview: false
    chat: true
    widgets: [lab.ai]
  - title: Home
    icon: home
    heading: false
    header: false
    overview: false
    widgets:
      - { widget: lab.cameras, size: large }
      - { widget: lab.thermostat, size: medium }
  - tab: Home
    heading: false
    columns: 2
    tabColumns: 1
    header: false
    widgets: [lab.home, lab.pc]
  - tab: Home
    heading: false
    header: false
    overview: false
    widgets:
      - { widget: lab.weather, size: medium }
      - { widget: lab.calendar, size: large }
  - title: Now
    heading: false
    tab: Media
    columns: 2
    widgets: [lab.streams, lab.downloads]
  - widgets:
      - { widget: lab.sky, size: medium }
      - { widget: lab.photos, size: tall }
      - { widget: lab.reading, size: medium }
      - { widget: lab.dns, size: small }
      - { widget: lab.drives, size: small }
      - { widget: lab.upcoming, size: wide }
  - title: Media
    overview: false
    heading: false
    columns: 1
    widgets: [lab.recent]
  - tab: Media
    overview: false
    heading: false
    columns: 3
    widgets: [lab.mostwatched, lab.plays, lab.people]
  - tab: Media
    overview: false
    heading: false
    columns: 1
    widgets: [lab.week, lab.requests]
  - title: Library
    columns: 1
    overview: false
    widgets: [lab.docs, lab.saved]
  - title: Reading
    tab: Library
    overview: false
    columns: 1
    widgets: [lab.news, lab.feeds]
