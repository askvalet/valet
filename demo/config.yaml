# The public demo: real Valet, made-up homelab. Everything on the page comes from integrations/homelab.mjs and the
# assistant is the scripted stand-in in mock-model.mjs. No secrets, no real services, nothing worth stealing.
title: Valet
greeting: Daniel
timezone: America/Toronto
location: Example, Canada
allowedHosts: []
auth: { mode: none, trustNetwork: true }   # every control is make-believe and undoes itself within ten minutes
reload: false
sandbox: true   # nothing is saved, and each visitor gets a private copy that's gone when they leave

appearance:
  wallpaper: /demo/wallpaper.jpg
  dim: 0.3
  blur: 4
  rim: 0.7

assistant:
  baseURL: http://valet-demo-model:8080/v1
  apiKey: demo
  model: qwen3.8-27b
  contextWindow: 32768   # what the scripted model claims to hold, so the chat's context meter has something to fill
  name: Valet
  maxSteps: 4
  access: { default: control }
  background: { watch: false, brief: true, suggest: true }
  suggestions: [What should we watch tonight?, Turn off the living room lights, Anything happen overnight?, How are the downloads doing?]

integrations:
  lab:
    type: demo-homelab

chat:
  beam: once
  beamColor: colorful
  beamStrength: 1
  followUps: [Why is Mealie down?, Pause Pi-hole, Turn off the living room lights, What should we watch tonight?, Anything happen overnight?, How are the downloads doing?]
hero: { scope: [downloads, lights, what to watch], review: false }   # the year in review is still at #recap, just not offered

menubar: [lab.system]
weather: lab.weather
calendar: lab.calendar
format: { weekStart: monday }
live:
  activities: [lab.streams, lab.downloads, lab.home]

nav: { order: [Services, AI, Home, Media, Library] }

# /wall: its own pages for a screen across the room, taking turns every minute
wall:
  every: 1m
  pages:
    - title: Now
      layout:
        - widgets: [lab.streams, lab.downloads]
          columns: 2
        - display: tiles
          widgets: [lab.system]
    - title: House
      every: 30s
      layout:
        - widgets:
            - { widget: lab.cameras, size: large, rows: 2 }
            - { widget: lab.thermostat, size: medium }
            - { widget: lab.sky, size: medium }
    - title: Services
      layout:
        - widgets: [lab.services]
          columns: 1
          header: false

layout:
  - title: Services
    variant: minimal
    header: false
    widgets: [lab.services]
  - tab: Services
    heading: false
    overview: false
    widgets:
      - { widget: lab.dns, size: large }
      - { widget: lab.drives, size: medium }
      - { widget: lab.containers, size: large }
      - { widget: lab.updates, size: tall }
      - { widget: lab.jobs, size: medium }
      - { widget: valet.backups, size: medium }
      - { widget: lab.system, size: medium }
  - title: AI
    display: tiles
    overview: false
    chat: true
    widgets: [lab.ai]
  - title: Home
    icon: home
    heading: false
    header: false
    overview: false
    widgets:
      - { widget: lab.cameras, size: large, rows: 2 }
      - { widget: lab.thermostat, size: medium }
      - { widget: lab.sky, size: medium }
  - tab: Home
    heading: false
    columns: 2
    tabColumns: 1
    header: false
    widgets: [lab.home, lab.pc]
  - title: Now
    heading: false
    tab: Media
    columns: 2
    widgets: [lab.streams, lab.downloads]
  - tab: Home
    heading: false
    header: false
    overview: false
    widgets:
      - { widget: lab.weather, size: medium }
      - { widget: lab.calendar, size: large }
  - widgets:
      - { widget: lab.recent, view: coverflow }
  - widgets:
      - { widget: lab.sky, size: medium }
      - { widget: lab.photos, size: tall }
      - { widget: lab.reading, size: medium }
      - { widget: lab.dns, size: small }
      - { widget: lab.drives, size: small }
      - { widget: lab.upcoming, size: wide }
  - title: Media
    overview: false
    heading: false
    columns: 3
    widgets:
      - { widget: lab.race, size: large }
      - { widget: lab.mostwatched, size: medium }
      - { widget: lab.people, size: medium }
      - { widget: lab.plays, size: large }
  - tab: Media
    overview: false
    heading: false
    columns: 1
    widgets: [lab.viewing]
  - tab: Media
    overview: false
    heading: false
    columns: 1
    widgets: [lab.games, lab.recent]
  - title: Library
    columns: 1
    overview: false
    widgets: [lab.album, lab.books, lab.docs]
  - title: Reading
    tab: Library
    overview: false
    widgets:
      - { widget: lab.reading, size: large, rows: 2 }
      - { widget: lab.news, size: medium, rows: 2 }
  - tab: Library
    heading: false
    overview: false
    columns: 1
    widgets: [lab.feeds]
