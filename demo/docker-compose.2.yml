# The demo, sealed off. `valet-demo` and its scripted model sit on a network with no way out: no internet, no LAN, no
# host. The only door is the small proxy, published on the Docker bridge address, for a reverse proxy on this machine.
# Nothing here is public until that proxy says so. Build the image first: docker compose build (in the repo root).
name: valet-demo2
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  pids_limit: 128
  logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }

services:
  valet-demo2:
    <<: *hardened
    image: local/valet:feedback
    container_name: valet-demo2
    environment: { TZ: America/Toronto, VALET_CONFIG: /demo/config.yaml }
    volumes:
      - ./:/demo:ro
      - ./integrations:/app/data/integrations:ro
      - ./icons:/app/data/icons:ro
    tmpfs: ["/app/data:uid=1000,gid=1000,size=32m", "/tmp:size=16m"]
    networks: [sealed]
    depends_on: [valet-demo2-model]

  valet-demo2-model:
    <<: *hardened
    image: local/valet:feedback
    container_name: valet-demo2-model
    mem_limit: 64m
    entrypoint: ["node", "/demo/mock-model.mjs"]
    healthcheck: { disable: true }
    volumes: [./:/demo:ro]
    networks: [sealed]

  valet-demo2-edge:
    <<: *hardened
    image: caddy:2.11.7
    container_name: valet-demo2-edge
    cap_add: [NET_BIND_SERVICE]   # the binary carries this file capability, and won't start without it
    mem_limit: 64m
    command: caddy reverse-proxy --from :8080 --to valet-demo2:7575
    environment: { XDG_DATA_HOME: /tmp, XDG_CONFIG_HOME: /tmp }
    tmpfs: [/tmp]
    ports: [172.17.0.1:7581:8080]
    networks: [sealed, edge]

networks:
  sealed: { internal: true }
  edge: {}
