# Atrium with Docker Compose. Put config/config.yaml and .env next to this file, then: docker compose up -d
services:
  atrium:
    image: ghcr.io/OWNER/atrium:latest
    container_name: atrium
    restart: unless-stopped
    environment: { TZ: America/Toronto }   # your time zone, for times the server writes
    env_file: .env                    # secrets referenced as ${NAME} in config.yaml
    volumes:
      - ./config:/config                 # a folder, not the file: edits show up live. Add :ro if the assistant should never save config changes
      - ./data:/app/data              # wallpaper, icon cache, uploads, accounts
    ports:
      - 127.0.0.1:7575:7575         # this machine only; "7575:7575" for your whole network
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Optional, for `type: docker`: containers and logs, read-only. Give Atrium the `docker-proxy` network too (networks:
  # [default, docker-proxy]) and use url: http://atrium-dockerproxy:2375. Never mount the socket into Atrium itself.
  # atrium-dockerproxy:
  #   image: tecnativa/docker-socket-proxy:v0.5.0
  #   environment: { CONTAINERS: 1, POST: 0 }
  #   volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
  #   read_only: true
  #   tmpfs: [/run, /tmp, /var/lib/haproxy]
  #   cap_drop: [ALL]
