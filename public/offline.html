<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f0f10">
  <title>Valet can't be reached</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --card: rgb(255 255 255 / .8); --edge: rgb(0 0 0 / .08); }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0f10; --fg: #f2f2f3; --muted: #9a9aa0; --card: rgb(255 255 255 / .05); --edge: rgb(255 255 255 / .09); } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box;
      background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { box-sizing: border-box; width: 100%; max-width: 360px; padding: 28px 24px; border-radius: 22px; background: var(--card); border: 1px solid var(--edge); text-align: center; }
    svg { display: block; width: 44px; height: 44px; margin: 0 auto; }
    h1 { margin: 14px 0 4px; font-size: 19px; font-weight: 500; }
    p { margin: 0 0 20px; color: var(--muted); }
    a { display: inline-block; padding: 9px 18px; border-radius: 99px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#101114"/><path d="M9 22V13l7-5 7 5v9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
    <h1>Valet can't be reached</h1>
    <p>This device is offline, or the server Valet runs on isn't answering. Try again once it's back.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
